name: Build Executable Application

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pyautogui Pillow

    - name: Convert Image to ICO
      run: |
        python -c "from PIL import Image; img = Image.open('pngtree-mr-rat-sticker-png-image_14544288.png'); img.save('logo.ico', format='ICO')"

    - name: Build EXE with Custom Name and Icon
      run: |
        pyinstaller --onefile --noconsole --icon=logo.ico --name="Mouse Jiggler Pro" "Mouse Jigler/mouse_jiggler.py"

    - name: Upload Built Application
      uses: actions/upload-artifact@v4
      with:
        name: MouseJigglerPro-Executable
        path: dist/Mouse Jiggler Pro.exe
